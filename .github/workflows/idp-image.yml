name: IdP image

on:
  push:
    tags:
      - "idp-*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=paperclip-idp-amd64
          cache-to: type=gha,mode=max,scope=paperclip-idp-amd64
          tags: ghcr.io/${{ github.repository_owner }}/paperclip-idp:${{ github.ref_name }}
